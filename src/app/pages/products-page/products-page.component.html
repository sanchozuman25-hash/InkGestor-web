<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <a class="text-muted small text-decoration-none" routerLink="/studios">← Estudios</a>
    <h2 class="h4 mb-0">{{ studioName }}</h2>
    <p class="text-muted small mb-0">Productos y stock</p>
  </div>
  <button class="btn btn-primary" (click)="openAdd()">Añadir producto</button>
</div>

<div class="row g-3">
  @for (item of items(); track item.id) {
    <div class="col-12 col-md-6 col-xl-4">
      <app-product-card [product]="item" (editClicked)="openEdit(item)" (deleteClicked)="askDelete(item)" />
    </div>
  } @empty {
    <p class="text-muted">Este estudio todavía no tiene productos.</p>
  }
</div>

@if (showModal()) {
  <app-product-modal [item]="editing()" (saved)="save($event)" (closed)="closeModal()" />
}

@if (deleting(); as d) {
  <app-confirm-delete-modal
    [message]="'¿Seguro que quieres eliminar este producto (' + d.name + ')?'"
    (confirmed)="onDeleteConfirmed($event)" />
}
