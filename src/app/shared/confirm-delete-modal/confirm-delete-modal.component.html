<div class="modal d-block" tabindex="-1" style="background: rgba(0, 0, 0, 0.5)" (click)="confirmed.emit(false)">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title() }}</h5>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="confirmed.emit(false)"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">{{ message() }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="confirmed.emit(false)">No, cancelar</button>
        <button type="button" class="btn btn-danger" (click)="confirmed.emit(true)">Sí, eliminar</button>
      </div>
    </div>
  </div>
</div>
